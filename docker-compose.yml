services:
  postgres:
    image: postgres:16-alpine
    container_name: rhcorp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env (veja .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env (veja .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      - "127.0.0.1:${RHCORP_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rhcorp_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: rhcorp-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - rhcorp_redisdata:/data

volumes:
  rhcorp_pgdata:
  rhcorp_redisdata:
